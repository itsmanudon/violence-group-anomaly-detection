# Unspecified values use validated defaults in surveillance.actor_config.
seed: 42
device: auto
data:
  num_frames: 10
  image_size: [480, 720]
  input_mode: precomputed
model:
  mode: pose_only
  embedding_dim: 128
  pose_feature_dim: 98304
  transformer:
    num_layers: 1
    num_heads: 1
    feedforward_dim: 256
    dropout: 0.1
    positional_encoding: true
backbones:
  pose: {checkpoint: null, frozen: true}
loss: {group_weight: 1.0, actor_weight: 1.0}
training:
  optimizer: adam
  learning_rate: 0.0001
  betas: [0.9, 0.999]
  max_iterations: 20000
  lr_milestones: [5000, 10000]
  lr_gamma: 0.1
  batch_size: 16
