[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surveillance-research"
version = "0.1.0"
description = "Weakly supervised surveillance anomaly research baseline"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "opencv-python>=4.8", "scikit-learn>=1.3", "PyYAML>=6", "tensorboard>=2.15", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
